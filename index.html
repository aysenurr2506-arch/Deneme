<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Verimlilik Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Kart ve Genel Tasarım */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        /* Başlangıç Ekranı */
        #setupScreen {
            text-align: center;
            max-width: 500px;
            margin: 100px auto;
        }

        /* Bakiye Kartı */
        .balance-card {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            text-align: center;
            padding: 40px;
        }
        .balance-amount { font-size: 3em; font-weight: bold; }

        /* Form Elemanları */
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }
        .btn {
            background: #764ba2;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }

        /* Tab Menü */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 15px; border-radius: 15px; border: none;
            background: white; cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background: #764ba2; color: white; }

        /* Grid Sistemi */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="setupScreen" class="card">
            <i class="fas fa-wallet fa-3x" style="color: #764ba2; margin-bottom: 20px;"></i>
            <h2>Hoş Geldiniz!</h2>
            <p style="margin-bottom: 20px; color: #666;">Başlamak için cüzdanınızdaki toplam tutarı girin.</p>
            <input type="number" id="initialBalance" placeholder="Örn: 5000" style="margin-bottom: 15px;">
            <button class="btn" onclick="startApp()">Cüzdanı Oluştur</button>
        </div>

        <div id="mainDashboard" class="hidden">
            <div class="tabs">
                <button class="tab-btn active"><i class="fas fa-wallet"></i> Finans</button>
                <button class="tab-btn"><i class="fas fa-clock"></i> Pomodoro</button>
            </div>

            <div class="card balance-card">
                <div class="balance-amount" id="displayBalance">0,00 ₺</div>
                <div>Güncel Bakiyeniz</div>
            </div>

            <div class="dashboard-grid">
                <div class="card">
                    <h3><i class="fas fa-minus-circle"></i> Harcama Ekle</h3>
                    <div class="input-group">
                        <label>Miktar (TL)</label>
                        <input type="number" id="expAmount" placeholder="0.00">
                    </div>
                    <div class="input-group">
                        <label>Kategori</label>
                        <select id="expCategory">
                            <option>Yemek</option>
                            <option>Ulaşım</option>
                            <option>Eğlence</option>
                            <option>Fatura</option>
                        </select>
                    </div>
                    <button class="btn" onclick="addExpense()">Harcamayı Düş</button>
                </div>

                <div class="card">
                    <canvas id="expenseChart" style="max-height: 250px;"></canvas>
                </div>
            </div>

            <div class="card">
                <h3>Harcama Geçmişi</h3>
                <div id="historyList" style="margin-top: 15px;">
                    <p style="color: #888; text-align: center;">Henüz işlem yok.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let balance = 0;
        let expenses = [];
        let myChart;

        function startApp() {
            const initial = document.getElementById('initialBalance').value;
            if(initial > 0) {
                balance = parseFloat(initial);
                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                updateUI();
                initChart();
            } else {
                alert("Lütfen geçerli bir bakiye girin.");
            }
        }

        function addExpense() {
            const amt = parseFloat(document.getElementById('expAmount').value);
            const cat = document.getElementById('expCategory').value;
            
            if(amt > 0 && amt <= balance) {
                balance -= amt;
                expenses.push({ amt, cat, date: new Date().toLocaleTimeString() });
                document.getElementById('expAmount').value = "";
                updateUI();
                updateChart();
            } else if (amt > balance) {
                alert("Yetersiz bakiye!");
            }
        }

        function updateUI() {
            document.getElementById('displayBalance').innerText = balance.toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + " ₺";
            
            const history = document.getElementById('historyList');
            if(expenses.length > 0) {
                history.innerHTML = expenses.map(e => `
                    <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;">
                        <span><b>${e.cat}</b> - ${e.date}</span>
                        <span style="color:#e74c3c">-${e.amt} TL</span>
                    </div>
                `).reverse().join('');
            }
        }

        function initChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Kalan Para', 'Harcamalar'],
                    datasets: [{
                        data: [balance, 0],
                        backgroundColor: ['#2ecc71', '#e74c3c']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function updateChart() {
            const totalExp = expenses.reduce((sum, e) => sum + e.amt, 0);
            myChart.data.datasets[0].data = [balance, totalExp];
            myChart.update();
        }
    </script>
</body>
</html>
